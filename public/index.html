<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChilliChat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="join-screen" class="join-screen">
    <div class="join-title-block">
      <h1>ChilliChat</h1>
      <p class="by">by JbnZ</p>
      <p class="tagline">Pick your identity to enter the lobby</p>
    </div>

    <div class="join-box">
      <label class="field-label" for="handle-input">Handle</label>
      <input type="text" id="handle-input" placeholder="Enter a handle..." maxlength="15" />

      <p class="field-label">Colour</p>
      <div id="color-options" class="color-options">
        <div class="color-swatch" data-color="#ff0033" style="background-color:#ff0033"></div>
        <div class="color-swatch" data-color="#ff8800" style="background-color:#ff8800"></div>
        <div class="color-swatch" data-color="#ffee00" style="background-color:#ffee00"></div>
        <div class="color-swatch" data-color="#99ff00" style="background-color:#99ff00"></div>
        <div class="color-swatch" data-color="#39ff14" style="background-color:#39ff14"></div>
        <div class="color-swatch" data-color="#00ff99" style="background-color:#00ff99"></div>
        <div class="color-swatch" data-color="#00eeff" style="background-color:#00eeff"></div>
        <div class="color-swatch" data-color="#0099ff" style="background-color:#0099ff"></div>
        <div class="color-swatch" data-color="#4d5eff" style="background-color:#4d5eff"></div>
        <div class="color-swatch" data-color="#9900ff" style="background-color:#9900ff"></div>
        <div class="color-swatch" data-color="#ff00dd" style="background-color:#ff00dd"></div>
        <div class="color-swatch" data-color="#ff0088" style="background-color:#ff0088"></div>
      </div>

      <button id="join-btn">Enter Lobby</button>
    </div>
  </div>

  <div id="chat-screen" class="chat-screen hidden">
    <header class="app-header">
      <h1>ChilliChat <span class="by">by JbnZ</span></h1>
    </header>

    <div class="main-area">
      <div class="lobby-column">
        <div id="messages-box" class="messages-box">
          <p class="system-msg">Welcome to ChilliChat!</p>
        </div>
        <p id="typing-indicator" class="typing-indicator"></p>
       <div class="input-row">
          <input type="text" id="message-input" placeholder="Type a message..." />
          <button id="send-btn">Send</button>
        </div>
        <a href="https://cbradio.pages.dev/" target="_blank" rel="noopener noreferrer" class="cb-radio-btn">
          GO LIVE — Switch to Voice on Global Chaos CB Radio
          <svg class="external-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </a>
      </div>

      <div class="users-column">
        <h2>Lobby</h2>
        <ul id="users-list" class="users-list"></ul>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
