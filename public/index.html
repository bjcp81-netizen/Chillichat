<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChilliChat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="join-screen" class="join-screen">
    <h1>Chillichat <span class="by">by JbnZ</span></h1>
    <div class="join-box">
      <h2>Choose your handle</h2>
      <input type="text" id="handle-input" placeholder="Enter a handle..." maxlength="15" />
      <p class="color-label">Pick a colour:</p>
      <div id="color-options" class="color-options">
        <div class="color-swatch swatch-red" data-color="#ff4136"></div>
        <div class="color-swatch swatch-green" data-color="#39ff14"></div>
        <div class="color-swatch swatch-blue" data-color="#0074d9"></div>
        <div class="color-swatch swatch-yellow" data-color="#ffdc00"></div>
        <div class="color-swatch swatch-purple" data-color="#b10dc9"></div>
        <div class="color-swatch swatch-orange" data-color="#ff851b"></div>
      </div>
      <button id="join-btn">Enter Lobby</button>
    </div>
  </div>

 <header class="app-header">
      <h1>Chillichat <span class="by">by JbnZ</span></h1>
      <button id="change-handle-btn" class="change-handle-btn">Not you? Change handle</button>
    </header>

    <div class="main-area">
      <div class="lobby-column">
        <div id="messages-box" class="messages-box">
          <p class="system-msg">Welcome to ChilliChat!</p>
        </div>
        <div class="input-row">
          <input type="text" id="message-input" placeholder="Type a message..." />
          <button id="send-btn">Send</button>
        </div>
      </div>

      <div class="users-column">
        <h2>Lobby</h2>
        <ul id="users-list" class="users-list"></ul>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
